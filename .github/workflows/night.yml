name: night-collect

# Every hour from 22:00 to 09:00 Kyiv time (UTC+2 in winter; one hour later in summer),
# while the PC is usually off. The PC collects the daytime hours itself.
on:
  schedule:
    - cron: "5 20-23,0-7 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect all Forever auction houses
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python cloud_collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: night-${{ github.run_id }}
          path: snapshots/*.csv.gz
          retention-days: 3
          compression-level: 0
